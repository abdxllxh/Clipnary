      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--brand-ink)
    }

    .evbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 8px 0 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      color: var(--brand-ink);
      cursor: pointer;
      border-radius: 8px;
      transition: color .15s ease
    }

    .evbtn:hover,
    .evpick.open .evbtn {
      color: var(--brand)
    }

    .evbtn .car {
      width: 14px;
      height: 14px;
      color: var(--faint)
    }

    .evpick .pick-menu {
      min-width: 240px
    }

    .pick-opt .ph {
      font-size: 11px;
      color: #9C8A7E;
      margin-left: 6px
    }

    .stat .evpick .pick-opt .pl {
      font-size: 13px;
      color: inherit
    }

    .stat .evpick .pick-opt .ph {
      font-size: 11px;
      color: #9C8A7E
    }

    .stat .evpick .evbtn .pv {
      font-size: 20px;
      color: inherit
    }

    .autonote {
      font-size: 12px;
      color: var(--faint);
      margin: -8px 0 14px
    }

    .stat span {
      font-size: 12px;
      color: var(--dim)
    }

    .meters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px
    }

    .meter {
      background: var(--muted);
      border-radius: var(--r);
      padding: 12px 14px
    }

    .meter h4 {
      font-size: 12px;
      color: var(--dim);
      font-weight: 600;
      margin-bottom: 9px
    }

    .spark {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      height: 46px
    }

    .spark i {
      flex: 1;
      background: var(--brand);
      min-height: 2px;
      border-radius: 1px
    }

    .spark.chat i {
      background: var(--good)
    }

    .said {
      font-size: 13px;
      color: var(--faint);
      height: 76px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end
    }

    .said div:last-child {
      color: var(--text)
    }

    /* ---------- tables + logs */
    .scroll {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--faint);
      padding: 0 10px 10px;
      white-space: nowrap
    }

    td {
      padding: 12px 10px;
      border-top: 1px solid var(--line);
      vertical-align: middle;
      overflow-wrap: anywhere
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    a.lnk {
      color: var(--brand-ink);
      text-decoration: none;
      font-weight: 600
    }

    .log {
      display: flex;
      flex-direction: column
    }

    .log div {
      display: flex;
      gap: 14px;
      padding: 11px 0;
      font-size: 13px
    }

    .log div+div {
      border-top: 1px solid var(--line)
    }

    .log time {
      color: var(--faint);
      white-space: nowrap;
      flex: none;
      width: 118px
    }

    /* ---------- plans */
    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px
    }

    .plan {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 18px;
      border-radius: var(--r);
      background: #fff;
      border: 1px solid var(--line-2);
      cursor: pointer;
      font-size: 13px;
      color: var(--dim)
    }

    .plan b {
      font-size: 16px;
      font-weight: 600;
      color: var(--brand-ink);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .plan b svg {
      color: var(--brand)
    }

    .plan em {
      position: absolute;
      top: 16px;
      right: 16px;
      font-style: normal;
      font-size: 11px;
      font-weight: 600;
      background: var(--brand-ink);
      color: var(--brand);
      padding: 2px 8px;
      border-radius: 999px
    }

    .plan input {
      position: absolute;
      opacity: 0;
      pointer-events: none
    }

    .plan.on {
      background: var(--brand-soft);
      border-color: var(--brand)
    }

    .plan:has(input:focus-visible) {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    /* ---------- dialogs + toasts */
    dialog {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: var(--r-lg);
      padding: 0;
      max-width: calc(100vw - 32px)
    }

    dialog.studio-dialog {
      width: 100vw;
      max-width: none;
      height: 100vh;
      max-height: none;
      border: 0;
      border-radius: 0;
      overflow: hidden
    }

    dialog::backdrop {
      background: rgba(14, 12, 11, .42);
      animation: fadein .16s ease
    }

    .dlg {
      padding: 24px;
      width: 450px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .dlg h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--brand-ink)
    }

    .dlg-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px
    }

    /* Regular dialogs live outside .app, so they need their own Clipnary theme
   tokens. Studio dialogs intentionally keep their separate editor palette. */
    dialog:not(.studio-dialog) {
      background: var(--muted);
      color: var(--text);
      border-color: var(--line-2)
    }

    dialog:not(.studio-dialog) .dlg h2 {
      color: var(--text)
    }

    dialog:not(.studio-dialog) .dlg .help {
      color: var(--dim)
    }

    dialog:not(.studio-dialog) .dlg .f {
      color: var(--text)
    }

    dialog:not(.studio-dialog) .dlg input {
      background: #202B40;
      border-color: #4A5872;
      color: var(--text)
    }

    dialog:not(.studio-dialog) .dlg input::placeholder {
      color: var(--faint);
      opacity: 1
    }

    dialog:not(.studio-dialog) .dlg .btn:not(.primary) {
      background: #202B40;
      border-color: #4A5872;
      color: var(--text)
    }

    dialog:not(.studio-dialog) .dlg .btn:not(.primary):hover {
      background: #2B3852;
      border-color: var(--brand-line);
      color: var(--text)
    }

    .editor {
      display: grid;
      grid-template-columns: minmax(240px, 340px) minmax(300px, 450px);
      max-height: calc(100vh - 48px)
    }

    .editor .stage {
      background: #17110E;
      display: grid;
      place-items: center;
      position: relative;
      min-height: 320px
    }

    .editor video,
    .editor .stage img {
      width: 100%;
      max-height: calc(100vh - 48px);
      aspect-ratio: 9/16;
      object-fit: contain;
      display: block
    }

    .old-render {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%
    }

    .old-render .making-badge {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%)
    }

    .editor .panel {
      padding: 22px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .editor-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px
    }

    .editor-head .row {
      justify-content: flex-end;
      flex-wrap: nowrap
    }

    .editor .adjust-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px
    }

    .editor .rangebox {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--muted)
    }

    .editor .rangebox input[type=range] {
      width: 100%;
      accent-color: var(--brand)
    }

    .editor .rangebox output {
      font-variant-numeric: tabular-nums;
      color: var(--brand-deep);
      font-weight: 700
    }

    .editor h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      margin-top: 6px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .recipe {
      width: min(980px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      overflow: auto
    }

    .recipe-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      min-height: 560px
    }

    .recipe-main {
      padding: 26px;
      display: grid;
      gap: 18px
    }

    .recipe-main h2 {
      font-size: 20px;
      color: var(--brand-ink)
    }

    .recipe-main .help {
      max-width: 660px
    }

    .recipe-side {
      padding: 26px;
      background: var(--muted);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px
    }

    .feature-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      background: #fff;
      cursor: pointer;
      min-height: 70px
    }

    .feature-card:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-soft)
    }

    .feature-card input {
      margin: 3px 0 0;
      accent-color: var(--brand);
      width: 17px;
      height: 17px;
      flex: none
    }

    .feature-card b {
      display: block;
      font-size: 13px;
      color: var(--brand-ink)
    }

    .feature-card small {
      display: block;
      color: var(--dim);
      font-size: 11px;
      margin-top: 2px
    }

    .recipe-source {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line-2);
      border-radius: var(--r);
      background: var(--muted)
    }

    .recipe-source-media {
      width: 150px;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 10px;
      background: #141c28;
      display: grid;
      place-items: center;
      color: var(--brand, #c8ff3b)
    }

    .recipe-source-media img,
    .recipe-source-media video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover
    }

    .recipe-source-media video {
      object-fit: contain;
      background: #17110E
    }

    .recipe-source-copy {
      min-width: 0
    }

    .recipe-source-copy b {
      display: block;
      color: var(--brand-ink);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .recipe-source-copy p {
      margin: 4px 0 0;
      color: var(--dim);
      font-size: 12px
    }

    .recipe-source-copy .sub {
      margin-top: 7px
    }

    .recipe-source .sk {
      height: 11px;
      background: linear-gradient(90deg, #E8DDD5 0%, #FFF7F1 50%, #E8DDD5 100%);
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite
    }

    .recipe-section {
      display: grid;
      gap: 10px
    }

    .recipe-section h3 {
      margin: 0
    }

    .recipe-section .help {
      margin: 0
    }

    .prompt-suggest {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px
    }

    .prompt-suggest .sub {
      margin-right: 3px
    }

    .prompt-chip {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: #fff;
      color: var(--dim);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease
    }

    .prompt-chip:hover,
    .prompt-chip:focus-visible {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand-ink)
    }

    .recipe-range {
      display: grid;
      gap: 10px;
      padding: 13px;
      border-radius: var(--r);
      background: var(--muted)
    }

    .recipe-range .range-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--dim);
      font-size: 12px
    }

    .recipe-range .range-label b {
      color: var(--brand-ink);
      font-weight: 600
    }

    .recipe-range input[type=range] {
      width: 100%;
      accent-color: var(--brand)
    }

    .recipe-range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .recipe-range-grid label {
      display: grid;
      gap: 6px;
      color: var(--dim);
      font-size: 12px
    }

    .recipe-range-grid input {
      width: 100%
    }

    .clip-evidence {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px
    }

    .clip-evidence span {
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--frame);
      color: var(--dim);
      font-size: 11px
    }

    .clip-evidence b {
      color: var(--text);
      font-weight: 600
    }

    .clip-meta {
      font-size: 11px;
      color: var(--faint);
      margin-top: 4px
    }

    .recipe-side h3 {
      font-size: 13px;
      color: var(--dim);
      margin-top: 4px
    }

    .recipe-total {
      font-size: 22px;
      font-weight: 700;
      color: var(--brand-ink)
    }

    .recipe-side .bar {
      margin-top: auto
    }

    .recipe-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line)
    }

    .recipe.studio-recipe {
      width: 100vw;
      max-width: none;
      height: 100vh;
      max-height: none;
      border: 0;
      border-radius: 0;
      overflow: hidden
    }

    .studio-recipe .recipe-shell {
      width: min(1440px, 100%);
      min-height: 100%;
      margin: 0 auto;
      grid-template-columns: minmax(0, 1fr) 320px
    }

    .studio-recipe .recipe-main {
      min-width: 0;
      overflow: auto;
      padding: 28px 34px 120px;
      align-content: start
    }

    .studio-recipe .recipe-side {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 30px 24px;
      border-left: 1px solid var(--line);
      overflow: auto
    }

    .studio-recipe .job-head {
      position: sticky;
      top: -28px;
      z-index: 3;
      margin: 0 -34px !important;
      padding: 18px 34px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line)
    }

    .studio-recipe .job-head h2 {
      font-size: 24px;
      letter-spacing: -.02em
    }

    .studio-recipe .job-head .help {
      margin-top: 4px
    }

    .studio-recipe .recipe-section {
      padding-top: 4px
    }

    .studio-recipe .recipe-section h3 {
      font-size: 16px;
      color: var(--brand-ink)
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px
    }

    .gallery-card {
      display: grid;
      grid-template-rows: 74px auto;
      gap: 9px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: #fff;
      color: var(--dim);
      cursor: pointer;
      text-align: left;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease
    }

    .gallery-card:hover,
    .gallery-card:focus-visible {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .gallery-card.selected {
      border-color: var(--brand-ink);
      background: var(--brand-soft)
    }

    .gallery-card[aria-pressed=true] .gallery-copy b:after {
      content: "  Selected";
      font-size: 10px;
      color: var(--brand-deep);
      font-weight: 600
    }

    .gallery-copy {
      display: grid;
      gap: 3px;
      min-width: 0
    }

    .gallery-copy b {
      font-size: 12px;
      color: var(--brand-ink)
    }

    .gallery-copy small {
      font-size: 10px;
      line-height: 1.35;
      color: var(--dim)
    }

    .cap-sample {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 74px;
      border-radius: 9px;
      background: #241911;
      color: #fff;
      font-size: 17px;
      letter-spacing: .01em;
      text-align: center;
      line-height: 1.02;
      padding: 8px;
      box-sizing: border-box
    }

    .cap-sample.large {
      font-size: 21px
    }

    .cap-sample.small {
      font-size: 14px
    }

    .cap-sample b {
      text-shadow: 0 1px 0 #111
    }

    .cap-sample.cap-highlighter b {
      padding: 2px 5px;
      border-radius: 4px;
      background: #F3C4E7;
      color: #211813 !important;
      text-shadow: none
    }

    .cap-sample.cap-sticker {
      color: #211813;
      background: #EDEDED;
      border: 4px solid #fff;
      box-shadow: inset 0 0 0 2px #211813
    }

    .cap-sample.cap-sticker b {
      color: #FF6B6B !important;
      text-shadow: none
    }

    .cap-sample.cap-handwritten {
      font-style: italic
    }

    .cap-sample.cap-retro_3d {
      text-shadow: 2px 2px 0 #FF694A, 4px 4px 0 #6B3BFF
    }

    .cap-sample.cap-neon {
      text-shadow: 0 0 7px #FF66FF, 0 0 14px #00FFFF
    }

    .cap-sample.cap-punch,
    .cap-sample.cap-comic {
      letter-spacing: .03em
    }

    .cap-sample.cap-breathe b {
      border-radius: 8px;
      padding: 2px 6px;
      background: #207934
    }

    .cap-sample.cap-popline b {
      border-bottom: 4px solid #FFCF33
    }

    .cap-sample.cap-marker b {
      background: #6BD7FF;
      color: #211813 !important;
      padding: 0 3px;
      text-shadow: none
    }

    .cap-sample.large {
      font-size: 21px
    }

    .cap-sample.small {
      font-size: 14px
    }

    .cap-sample b {
      text-shadow: 0 1px 0 #111
    }

    .layout-sample {
      display: block;
      position: relative;
      height: 74px;
      overflow: hidden;
      border-radius: 0;
      background: #1C1C1C
    }

    .layout-sample:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #252525, #333333 46%, #1F1F1F);
      opacity: .6
    }

    .layout-sample:after {
      content: "";
      position: absolute;
      left: 24%;
      right: 24%;
      top: 10%;
      bottom: 10%;
      border-radius: 0;
      background: #3A3A3A
    }

    .layout-sample.blur:before {
      filter: blur(8px)
    }

    .layout-sample.zoom:after {
      left: 15%;
      right: 15%;
      top: 4%;
      bottom: 4%
    }

    .layout-sample.crop:after {
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      border-radius: 0
    }

    .ratio-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px
    }

    .ratio-card {
      min-height: 64px;
      padding: 10px 6px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      background: #fff;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease
    }

    .ratio-card:hover,
    .ratio-card:focus-visible,
    .ratio-card.selected {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .ratio-card i {
      display: block;
      margin: 0 auto 7px;
      border: 2px solid currentColor;
      border-radius: 3px;
      width: 18px;
      height: 28px
    }

    .ratio-card.landscape i {
      width: 32px;
      height: 18px;
      margin-top: 5px;
      margin-bottom: 12px
    }

    .ratio-card.square i {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      margin-bottom: 9px
    }

    .ratio-card.portrait i {
      width: 22px;
      height: 28px
    }

    .effect-details {
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: #fff
    }

    .effect-details summary {
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 700;
      color: var(--brand-ink);
      list-style: none
    }

    .effect-details summary::-webkit-details-marker {
      display: none
    }

    .effect-details summary:after {
      content: "+";
      float: right;
      color: var(--brand)
    }

    .effect-details[open] summary:after {
      content: "−"
    }

    .effect-details .feature-grid {
      padding: 0 12px 12px
    }

    .effect-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 12px 14px
    }

    .effect-options .f {
      font-size: 12px
    }

    .source-player {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr);
      gap: 16px;
      align-items: stretch
    }

    .source-player .recipe-source {
      height: 100%;
      grid-template-columns: 1fr
    }

    .source-player .recipe-source-media {
      width: 100%;
      min-height: 190px;
      aspect-ratio: 16/9
    }

    .source-timeline {
      padding: 14px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: #fff
    }

    .source-timeline h3 {
      margin: 0 0 10px
    }

    .source-timeline .recipe-range {
      height: 100%;
      align-content: center
    }

    @media (max-width:1000px) {
      .studio-recipe .recipe-shell {
        grid-template-columns: 1fr
      }

      .studio-recipe .recipe-side {
        position: sticky;
        bottom: 0;
        top: auto;
        height: auto;
        border-left: 0;

    /* ---------- guided tour: dims the page, cuts a soft-moving hole around what each step talks about */
    #tour {
      position: fixed;
      inset: 0;
      z-index: 200
    }

    .tr-block {
      position: absolute;
      inset: 0
    }

    .tr-dim {
      position: absolute;
      inset: 0;
      background: rgba(20, 14, 11, .64);
      opacity: 0;
      transition: opacity .3s ease
    }

    .tr-ring {
      position: absolute;
      left: 0;
      top: 0;
      border: 2px solid var(--brand);
      border-radius: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease
    }

    .tr-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 400px;
      max-width: calc(100vw - 24px);
      background: #fff;
      border-radius: var(--r-lg);
      overflow: hidden;
      opacity: 0;
      transition: transform .5s cubic-bezier(.22, .8, .24, 1), opacity .3s ease;
      will-change: transform
    }

    #tour.on .tr-dim,
    #tour.on .tr-card,
    .tr-ring.on {
      opacity: 1
    }

    .tr-art {
      background: var(--brand-soft);
      margin: 8px 8px 0;
      border-radius: var(--r);
      height: 132px;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .tr-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0 46px
    }

    .tr-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 13px;
      border-radius: 10px;
      background: #fff;
      color: var(--brand-ink);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap
    }

    .tr-chip svg {
      width: 16px;
      height: 16px;
      color: var(--brand-deep)
    }

    .tr-chip.on {
      background: var(--brand)
    }

    .tr-chip.on svg {
      color: var(--brand-ink)
    }

    .tr-x {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: #fff;
      color: var(--brand-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color .15s ease
    }

    .tr-x:hover {
      background: var(--brand-line)
    }

    .tr-x svg {
      width: 14px;
      height: 14px
    }

    .tr-body {
      padding: 18px 22px 2px
    }

    .tr-body h2 {
      font-size: 19px;
      font-weight: 600;
      color: var(--brand-ink);
      letter-spacing: -.01em;
      padding-right: 0
    }

    .tr-body p {
      color: var(--dim);
      font-size: 14px;
      margin-top: 6px;
      min-height: 63px
    }

    .tr-chips,
    .tr-body h2,
    .tr-body p {
      animation: tr-in .45s cubic-bezier(.22, .8, .24, 1) both
    }

    .tr-body p {
      animation-delay: .05s
    }

    .tr-foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px 20px
    }

    .tr-bar {
      width: 64px;
      height: 4px;
      border-radius: 999px;
      background: var(--line-2);
      overflow: hidden;
      flex: none
    }

    .tr-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--brand-ink);
      border-radius: 999px;
      transition: width .5s cubic-bezier(.22, .8, .24, 1)
    }

    .tr-n {
      font-size: 13px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap
    }

    .tr-grow {
      flex: 1
    }

    .tr-back {
      width: 40px;
      height: 40px;
      border-radius: var(--r);
      border: 0;
      background: var(--muted);
      color: var(--brand-ink);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
      transition: background-color .15s ease, opacity .2s ease
    }

    .tr-back svg {
      transform: rotate(180deg)
    }

    .tr-back:hover {
      background: #EDE3DB
    }

    .tr-back[disabled] {
      opacity: 0;
      pointer-events: none
    }

    .tr-foot .btn {
      height: 40px;
      padding: 0 16px
    }

    @keyframes tr-in {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    @media (max-width:700px) {
      .tr-art {
        height: 92px
      }

      .tr-chips {
        gap: 6px;
        padding: 0 42px
      }

      .tr-chip {
        height: 30px;
        font-size: 12px;
        padding: 0 10px
      }

      .tr-body {
        padding: 14px 18px 0
      }

      .tr-body h2 {
        font-size: 17px
      }

      .tr-body p {
        min-height: 0
      }

      .tr-foot {
        padding: 12px 18px 16px
      }
    }

    @media (max-height:700px) {

        display: none
      }

      }

        padding-right: 44px
      }

      }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    @media (max-width:640px) {
      main#main {
        overflow-x: hidden
      }

      }

      .pick-menu {

      }

      .grid {

      }

      .jt {

      }

      }

      .jthumb .du {

        right: 4px;
        bottom: 4px
      }

      .job-head h3 {
        font-size: 14px
      }

      .job-head .sub {
        font-size: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden
      }

      .utabs {
        display: flex
      }

      .utabs .tabbtn {
        flex: 1;
        justify-content: center;
        padding: 0 8px
      }

      .recent-grid {
        grid-template-columns: 1fr
      }

      .recent-actions .btn {
        flex: 1;
        justify-content: center;
        min-width: 0
      }

      .card {
        padding: 16px
      }

      .card-head {
        flex-wrap: wrap;
        gap: 10px
      }

      .card-head .btn {
        width: 100%;
        justify-content: center
      }

      .scroll table:not(.stack) {
        min-width: 560px
      }

      table.stack,
      table.stack tbody {
        display: block
      }

      table.stack tr:first-child {
        display: none
      }

      table.stack tr {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        padding: 12px 0;
        border-top: 1px solid var(--line)
      }

      table.stack td {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 0;
        border: 0;
        font-size: 13px;
        text-align: left !important
      }

      table.stack td::before {
        content: attr(data-l);
        font-size: 11px;
        color: var(--faint)
      }

      table.stack td.c-main {
        grid-column: 1/-1;
        order: -1;
        font-weight: 600;
        color: var(--brand-ink)
      }

      table.stack td.c-main::before,
      table.stack td.c-act::before,
      table.stack td:empty {
        display: none
      }

      table.stack td.c-act {
        grid-column: 1/-1
      }

      .lc-acts {
        flex-wrap: wrap
      }

      .stream {
        padding: 8px;
        gap: 10px
      }

      .set-sec h2 {
        font-size: 16px
      }

      .ai-big {
        font-size: 24px
      }
    }

    /* Live Shorts Preview: 3 Layouts (Blurred fill, Zoomed in, Fill screen) */
    /* 1. Blurred fill (blur) */
    .recipe-live-frame.layout-blur .live-bg {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      filter: blur(14px) brightness(0.65) saturate(1.1);
      transform: scale(1.15);
      background-size: cover;
      background-position: center;
      display: block !important;
      opacity: 1;
    }

    .recipe-live-frame.layout-blur .live-subject {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      border-radius: 0;
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
    }

    .recipe-live-frame.layout-blur .live-caption {
      bottom: 8%;
      left: 8%;
      right: 8%;
    }

    /* 2. Zoomed in (zoom) */
    .recipe-live-frame.layout-zoom .live-bg {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      filter: blur(14px) brightness(0.65) saturate(1.1);
      transform: scale(1.15);
      background-size: cover;
      background-position: center;
      display: block !important;
      opacity: 1;
    }

    .recipe-live-frame.layout-zoom .live-subject {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 70%;
      background-size: cover;
      background-position: center;
      border-radius: 0;
      border: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
    }

    .recipe-live-frame.layout-zoom .live-caption {
      bottom: 8%;
      left: 8%;
      right: 8%;
    }

    /* 3. Fill screen (crop) */
    .recipe-live-frame.layout-crop .live-bg {
      display: none !important;
    }

    .recipe-live-frame.layout-crop .live-subject {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
      background-size: cover;
      background-position: center;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    .recipe-live-frame.layout-crop .live-caption {
      bottom: 8%;
      left: 8%;
      right: 8%;

    .transition-card:hover,

      background: #2D2D2D !important;
      color: #fff
    }

    .transition-card.selected {
      border-color: var(--brand, #D6FF75) !important;
      background: #252525 !important;

    .transition-sample {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      height: 44px;
      padding: 0 6px;
      border-radius: 0 !important;
      overflow: hidden;
      background: #1C1C1C !important;
      border: 1px solid #333333
    }

    .transition-sample:after {
      content: "";
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0
    }

    .transition-sample i,
    .transition-sample b {
      position: relative;
      z-index: 1;
      font-size: 8px;
      font-style: normal;
      letter-spacing: .04em;
      color: #fff
    }

    .transition-sample.fade:after {
      background: linear-gradient(90deg, transparent, #111, transparent);
      opacity: .28
    }

    .transition-sample.dip_black:after {
      background: #000;
      opacity: .48
    }

    .transition-sample.flash:after {
      background: #fff;
      opacity: .4
    }

    .transition-card:hover .transition-sample.fade:after,
    .transition-card:focus-visible .transition-sample.fade:after {
      animation: transition-fade-demo .9s ease-in-out infinite
    }

    .transition-card:hover .transition-sample.dip_black:after,
    .transition-card:focus-visible .transition-sample.dip_black:after {
      animation: transition-dip-demo .9s ease-in-out infinite
    }

    .transition-card:hover .transition-sample.flash:after,
    .transition-card:focus-visible .transition-sample.flash:after {
      animation: transition-flash-demo .72s ease-in-out infinite
    }

    @keyframes transition-fade-demo {

      0%,

        opacity: .08;
        transform: translateX(-18%)

        opacity: .78;
        transform: translateX(18%)
      }

          setProcessStage("check", `Checking video link ${finished + 1} of ${total}…`, 14 + Math.round(finished / Math.max(1, total) * 24));
          try { l.info = await lookUp(l.url); l.state = "ok"; }
          catch (e) { l.state = "bad"; l.msg = e.message; failed++; }
          finished++;
          drawAtt();
        }
        const links = A.links.filter(x => x.state === "ok");
        const files = A.files.slice();
        setProcessStage("send", "Sending the selected media…", 44);
        for (const l of links) {
          l.sending = true; drawAtt();
          try { await send("/api/jobs", { url: l.url, options: opts, creator: who }); l.state = "done"; started++; }

          setProcessStage("send", `Sending media ${Math.min(finished, total)} of ${total}…`, 44 + Math.round(finished / Math.max(1, total) * 34));

          setProcessStage("send", `Uploading ${f.file.name}…`, 44 + Math.round(finished / Math.max(1, total) * 34));
          try { await sendFile(f, who); f.state = "done"; started++; }
          catch (e) { f.state = "error"; f.err = e.message; failed++; }
          finished++; drawAtt();
          setProcessStage("send", `Media ${Math.min(finished, total)} of ${total} is ready.`, 44 + Math.round(finished / Math.max(1, total) * 34));

    function initScrollObserver() {
      const items = $$(".scroll-reveal");
      if (!items.length) return;
      if (!("IntersectionObserver" in window)) {
        items.forEach(item => item.classList.add("revealed"));
        return;
      }
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("revealed");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.08 });
      items.forEach(item => observer.observe(item));
    }

    async function loadOverview() { try { S.overview = await api("/api/overview"); } catch { return; } if (S.view === "queue") drawQueue(); else drawOverview(); }
    function barChart(daily) {
      const W = 720, H = 230, pl = 30, pb = 28, pt = 12, n = daily.length, ch = H - pt - pb;
      const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
      const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
      const y = v => pt + ch * (1 - v / top);
      let g = "";
      for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
      daily.forEach((d, i) => {
        const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], { day: "numeric", month: "short" });
        g += `<g><title>${lab}: ${d.clips} clips made, ${d.posted} posted${d.views ? ", " + d.views.toLocaleString() + " views" : ""}</title>
      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
        if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
      });
      const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No clips in the last 14 days yet</text>` : "";
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clips made and posted per day, last 14 days">${g}${none}</svg>`;
    }

function render() {
  drawShell(); drawJobs(); drawStream(); drawSelBar();
  if (S.view === "overview") drawOverview();
  if (S.view === "howto") drawHowTo();
  if (S.view === "creators") drawCreatorsPage();
  if (S.view === "streamers") drawStreamersPage();
  if (S.view === "campaigns") drawCampaignsPage();
  if (S.view === "usage") { if (S.usage) drawUsage(); else loadUsage(); }
  if ($("#clog")) drawLog();
  if (D.jid) drawClipDlg(false);
}
async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

    if (a === "storopen") { await send("/api/storage/open"); return; }
    if (a === "storchange") { S.storOpen = !S.storOpen; S.storNew = ""; return drawSettings(); }
    if (a === "storpick") {
      b.disabled = true;
      try { const r = await send("/api/storage/pick"); if (r.path) { S.storNew = r.path; $("#stor_new").value = r.path; } } finally { b.disabled = false; }
      return;
    }
    if (a === "storsave") {
      const s = await send("/api/storage", {path: $("#stor_new").value, move: $("#stor_move").checked}, "PUT");
      S.storOpen = false; toast("Saved. Close Clipnary and start it again to switch to the new folder.", "ok"); return drawSettings();
    }
    if (a === "storcancel") { await send("/api/storage", {cancel: true}, "PUT"); toast("Kept the current folder", "ok"); return drawSettings(); }
    if (a === "appsetup") { S.setupOpen = d.p && S.setupOpen !== d.p ? d.p : ""; return drawSettings(); }
    if (a === "copytext") { await navigator.clipboard.writeText(d.t); return toast("Copied", "ok"); }
    if (a === "appsave") {
      await send("/api/apps", {platform: d.p, client_id: $("#app_id").value, client_secret: $("#app_secret").value}, "PUT");
      S.setupOpen = ""; S.status = await api("/api/status"); toast("Saved. People can connect now.", "ok"); return drawSettings();
    }
    if (a === "bell") return openBell();
    if (a === "feedback") return openFeedback("bug");
    if (a === "report") return openFeedback("bug", d.ctx);
    if (a === "acctmenu") return openAcct();
    if (a === "bellread") { await markRead(); return openBell().then(openBell); }
    if (a === "ntgo") { closePops(); const l = d.link || ""; if (l.startsWith("/app")) { const [v, tab] = fromPath(l); return go(v, tab); } if (l.startsWith("/")) location.href = l; return; }
    if (a === "csave") return void await saveCreator();
    if (a === "cdiscard") { drawCreatorForm(); return toast("Changes discarded"); }
    if (a === "pause") { await send("/api/settings", {paused:!S.overview.paused}, "PUT"); return loadOverview(); }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return loadOverview(); }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return drawSettings(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return drawSettings();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => body[i.dataset.f] = i.type === "number" ? Number(i.value) : i.value);
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now" : "Added to the queue", "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
</script>
</body>
</html>
