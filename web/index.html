<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipnary — AI clip studio</title>
  <link rel="icon" type="image/svg+xml" href="/brand/clipnary-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@600;700;800&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.lordicon.com/lordicon.js"></script>
  <style>
    :root {
      --brand: #D6FF75;
      --brand-press: #B8ED55;
      --brand-ink: #0B0E17;
      --brand-soft: rgba(214, 255, 117, .12);
      --brand-line: rgba(214, 255, 117, .32);
      --brand-deep: #B8ED55;
      --frame: #0B0E17;
      --frame-2: #151B2B;
      --frame-line: #2A3245;
      --frame-text: #F7F9FF;
      --frame-dim: #99A7C0;
      --bg: #0E121D;
      --muted: #151B2B;
      --line: #2A3245;
      --line-2: #3A465E;
      --text: #F7F9FF;
      --dim: #99A7C0;
      --faint: #6F7D97;
      --good: #8ADD68;
      --good-soft: #1B372B;
      --bad: #FF797E;
      --bad-soft: #3A202B;
      --live: #FF797E;
      --r-lg: 0px;
      --r: 0px;
      --r-sm: 0px;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      border-radius: 0 !important
    }

    [hidden] {
      display: none !important
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--frame);
      color: var(--text);
      font: 14px/1.5 "Inter", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin: 0
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    svg {
      width: 18px;
      height: 18px;
      flex: none;
      fill: currentColor
    }

    ::selection {
      background: var(--brand-line)
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: #2A3245;
      border-radius: 0 !important;
      border: 3px solid #0E121D
    }

    /* ---------- frame */
    .app {
      display: block;
      height: 100vh
    }

    .side {
      display: none;
      background: var(--frame);
      color: var(--frame-text);
      flex-direction: column;
      height: 100vh;
      padding: 14px 10px 12px;
      min-width: 0
    }

    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 4px 22px 6px
    }

    .side-head .logo {
      height: 32px;
      width: 32px;
      display: block
    }

    .side-head .mark {
      display: none;
      width: 34px;
      height: 34px
    }

    .clipnary-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--text);
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      letter-spacing: -.045em
    }

    .clipnary-lockup b {
      color: var(--brand);
      font-weight: 800
    }

    .clipnary-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(214, 255, 117, .25);
      border-radius: 11px;
      background: #151B2B;
      color: var(--brand);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18)
    }

    .clipnary-mark img {
      width: 22px;
      height: 22px;
      display: block
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: var(--r);
      border: 0;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      flex: none
    }

    .side .icon-btn {
      color: var(--frame-dim)
    }

    .icon-btn:active {
      background: var(--muted)
    }

    .side .icon-btn:active {
      background: var(--frame-2)
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      scrollbar-width: none
    }

    .nav::-webkit-scrollbar {
      display: none
    }

    .nav h4 {
      font-size: 12px;
      font-weight: 500;
      color: var(--frame-dim);
      padding: 14px 10px 4px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      border: 0;
      background: transparent;
      color: var(--frame-text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left
    }

    .nav-item svg {
      width: 17px;
      height: 17px
    }

    .nav-item svg {
      color: var(--frame-dim)
    }

    .nav-item:active {
      background: var(--frame-2)
    }

    .nav-item.on {
      background: var(--brand);
      color: var(--brand-ink);
      font-weight: 600
    }

    .nav-item.on svg {
      color: var(--brand-ink)
    }

    .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .count {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      color: var(--frame-text);
      white-space: nowrap
    }

    .nav-item.on .count {
      background: rgba(42, 26, 18, .14);
      color: var(--brand-ink)
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(200, 255, 59, .18);
      color: var(--brand, #c8ff3b);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      flex: none;
      overflow: hidden
    }

    img.avatar {
      object-fit: cover;
      background: rgba(255, 255, 255, .08)
    }

    .tav {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      background: var(--muted)
    }

    #title {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .chprev {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--muted);
      animation: rise .25s ease both
    }

    .chprev img,
    .chprev .ph {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      background: #EFE7E1
    }

    .chprev b {
      display: block;
      font-size: 14px;
      color: var(--brand-ink)
    }

    .chprev span {
      font-size: 12px;
      color: var(--faint)
    }

    .chprev.bad {
      background: #FDECEC;
      color: #A12A2A;
      font-size: 13px
    }

    .chprev .sk {
      width: 120px
    }

    .nav-item.on .avatar {
      background: var(--brand-ink);
      color: var(--brand)
    }

    .nav-item.on img.avatar {
      background: var(--brand-ink)
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 1.3s infinite;
      flex: none
    }

    .side-foot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 12px;
      border-top: 1px solid var(--frame-line)
    }

    .side-card {
      background: var(--frame-2);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--frame-dim);
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .side-card div {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3DDC97;
      flex: none
    }

    .led.no {
      background: #FF6B78
    }

    .led.mid {
      background: var(--brand)
    }

    .plans-btn {
      margin-top: 10px;
      width: 100%;
      background: var(--frame-text);
      color: var(--brand-ink);
      border: 0
    }

    .scrim {
      display: none
    }

    main {
      background: var(--bg);
      margin: 0;
      border-radius: 0;
      height: 100vh;
      overflow-y: auto;
      min-width: 0;
      scrollbar-gutter: stable
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      isolation: isolate;
      background: rgba(14, 18, 29, .94);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      padding: 12px clamp(18px, 3.2vw, 44px);
      min-height: 76px;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transition: border-color .2s ease
    }

    .top-brand {
      display: inline-flex;
      align-items: center;
      flex: none;
      text-decoration: none
    }

    .top-brand .clipnary-lockup {
      font-size: 20px
    }

    .top-brand .clipnary-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px
    }

    .topbar-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
      max-width: 42vw;
      flex-wrap: wrap
    }

    .topbar-center .titles {
      flex: 0 1 auto;
      min-width: 0;
      max-width: min(42vw, 360px);
      text-align: center
    }

    .topbar-center #tpic {
      display: inline-flex;
      flex: none
    }

    .mainnav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      order: 2;
      flex: 0 1 auto
    }

    .mainnav::-webkit-scrollbar {
      display: none
    }

    .mainnav-link,
    .mainnav summary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--dim);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      list-style: none;
      text-decoration: none;
      transition: background-color .15s ease, color .15s ease
    }

    .mainnav-link:hover,
    .mainnav summary:hover {
      background: #202B40;
      color: var(--text)
    }

    .mainnav-link.on {
      background: var(--brand-soft);
      color: var(--brand)
    }

    .mainnav-link svg,
    .mainnav summary svg {
      width: 16px;
      height: 16px
    }

    .nav-count {
      min-width: 18px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--brand-line);
      color: var(--brand-deep);
      font-size: 10px;
      text-align: center
    }

    .creator-directory {
      display: grid;
      grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
      gap: 18px;
      align-items: start
    }

    .creator-directory-list {
      display: grid;
      gap: 6px
    }

    .creator-directory-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 7px;
      border: 1px solid transparent;
      border-radius: 10px
    }

    .creator-directory-row.on {
      background: var(--brand-soft);
      border-color: var(--brand-line)
    }

    .creator-directory-row:hover {
      background: var(--muted)
    }

    .creator-directory-link {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 6px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer
    }

    .creator-directory-link .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700
    }

    .creator-directory-row .delete {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--faint);
      cursor: pointer;
      display: grid;
      place-items: center
    }

    .creator-directory-row .delete:hover {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .creator-directory-empty {
      display: grid;
      gap: 8px;
      justify-items: start;
      padding: 18px 8px;
      color: var(--dim);
      font-size: 13px;
      line-height: 1.45
    }

    .creator-directory-empty svg {
      width: 28px;
      height: 28px;
      color: var(--brand)
    }

    .creator-directory-detail {
      min-width: 0
    }

    .creator-info {
      display: grid;
      gap: 16px
    }

    .creator-info-head {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .creator-info-head .avatar {
      width: 44px;
      height: 44px;
      font-size: 17px
    }

    .creator-info-head h2 {
      margin: 0
    }

    .creator-info-head p {
      margin: 3px 0 0;
      color: var(--dim);
      font-size: 13px
    }

    .creator-channel {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      font-size: 13px
    }

    .creator-channel span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dim)
    }

    @media (max-width:760px) {
      .creator-directory {
        grid-template-columns: 1fr
      }

      .creator-directory-detail {
        order: -1
      }
    }

    .source-title {
      color: inherit;
      text-decoration: none
    }

    .source-title:hover {
      text-decoration: underline;
      color: var(--brand-deep)
    }

    .recent-card {
      margin-bottom: 18px
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 12px
    }

    .recent-video {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden
    }

    /* Keep the complete source thumbnail visible. A creator may publish portrait or
   unusual-ratio thumbnails; cover-cropping hides the useful context and makes
   the card look like a random slice of the video. */
    .recent-thumb {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      aspect-ratio: 16/9;
      height: auto;
      overflow: hidden;
      border-radius: 8px;
      background: #1C1511
    }

    .recent-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain
    }

    .recent-thumb span {
      position: absolute;
      right: 5px;
      bottom: 5px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #111c;
      color: #fff;
      font-size: 10px
    }

    .recent-video-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden
    }

    .recent-title {
      display: -webkit-box;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: none;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3
    }

    .recent-title:hover {
      text-decoration: underline;
      color: var(--brand-deep)
    }

    .recent-meta {
      color: var(--faint);
      font-size: 11px;
      overflow-wrap: anywhere
    }

    .recent-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      min-width: 0
    }

    .recent-actions .btn {
      font-size: 11px;
      padding: 5px 7px;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere
    }

    .recent-loading {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 12px;
      padding: 6px 0
    }

    .recent-skeleton {
      width: 100%;
      min-width: 0;
      aspect-ratio: 16/9;
      height: auto;
      min-height: 120px;
      border-radius: 10px;
      background: linear-gradient(100deg, var(--muted) 30%, #27324A 45%, var(--muted) 60%);
      background-size: 220% 100%;
      animation: skeleton 1.3s ease-in-out infinite
    }

    .recent-skeleton:nth-child(2) {
      animation-delay: .1s
    }

    .recent-skeleton:nth-child(3) {
      animation-delay: .2s
    }

    .recent-skeleton:nth-child(4) {
      animation-delay: .3s
    }

    .recent-skeleton:nth-child(5) {
      animation-delay: .4s
    }

    .recent-skeleton:nth-child(6) {
      animation-delay: .5s
    }

    .recent-head {
      align-items: flex-start
    }

    .recent-head-actions {
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .recent-filters {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) repeat(3, minmax(140px, 1fr)) auto;
      gap: 8px;
      align-items: end;
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--muted)
    }

    .recent-filters label {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600
    }

    .recent-filters input,
    .recent-filters select {
      width: 100%;
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--text);
      font-size: 12px
    }

    .recent-filters input::placeholder {
      color: var(--faint)
    }

    .recent-filter-actions {
      display: flex;
      gap: 6px;
      align-items: end
    }

    .recent-filter-note {
      grid-column: 1/-1;
      color: var(--faint);
      font-size: 11px;
      overflow-wrap: anywhere
    }

    .dialog-saving {
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .dialog-saving i {
      width: 13px;
      height: 13px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite
    }

    .tutorial-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none
    }

    .tutorial-link:hover {
      text-decoration: underline
    }

    .tutorial-list {
      display: grid;
      gap: 10px
    }

    .tutorial-list>div {
      display: grid;
      gap: 3px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface)
    }

    .tutorial-list b {
      font-size: 13px
    }

    .tutorial-list span {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.45
    }

    .topbar .titles {
      flex: 1;
      min-width: 130px
    }

    .topbar .icon-btn.menu {
      display: none
    }

    .topbar.stuck {
      border-color: var(--line)
    }

    #vbanner:empty {
      display: none
    }

    .upd {
      display: grid;
      gap: 14px
    }

    .upd ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: var(--text);
      max-height: 180px;
      overflow: auto
    }

    .upd ul small {
      color: var(--dim)
    }

    .upd .cmd {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .upd .cmd code {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 12px;
      background: var(--muted);
      border-radius: 8px;
      padding: 9px 11px
    }

    .upd h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-ink);
      margin: 0
    }

    .vb {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 28px 0;
      padding: 12px 12px 12px 16px;
      border-radius: 12px;
      background: #FFF4E6;
      color: #7A3E0C;
      font-size: 14px;
      animation: rise .3s ease both
    }

    .vb svg {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--brand-deep)
    }

    .vb span {
      flex: 1;
      min-width: 0
    }

    .vb b {

    /* Lordicon & Universal Animated Hover System */
    lord-icon {
      display: inline-block;
      vertical-align: middle;
      transition: transform .24s cubic-bezier(0.34, 1.56, 0.64, 1), filter .24s ease
    }

    lord-icon:hover {
      transform: scale(1.18);
      filter: drop-shadow(0 0 6px rgba(214, 255, 117, .45))
    }

    [data-icon],
    svg:not(.chart) {
      transition: transform .22s cubic-bezier(0.34, 1.56, 0.64, 1), color .18s ease, opacity .18s ease, filter .22s ease;
      will-change: transform
    }

    @keyframes icon-hover-colour {
      0% {
        color: inherit
      }

      58% {
        color: var(--brand)
      }

      100% {
        color: var(--brand)
      }
    }

    @keyframes icon-pop {
      0% {
        transform: scale(1)
      }

      40% {
        transform: translateY(-3px) scale(1.2) rotate(-4deg)
      }

      75% {
        transform: translateY(1px) scale(1.08) rotate(2deg)
      }

      100% {
        transform: translateY(-2px) scale(1.14) rotate(0deg)
      }
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.06)
      }
    }

    .btn:hover [data-icon],
    .btn:focus-visible [data-icon],
    .chip:hover [data-icon],
    .chip:focus-visible [data-icon],
    .mainnav-link:hover [data-icon],
    .mainnav-link:focus-visible [data-icon],
    .nav-item:hover [data-icon],
    .nav-item:focus-visible [data-icon],
    .set-link:hover [data-icon],
    .set-link:focus-visible [data-icon],
    .howto-step:hover [data-icon],
    .icon-btn:hover [data-icon],
    .tabbtn:hover [data-icon],
    .tile:hover [data-icon],
    .appcard:hover [data-icon],
    .creator-channel:hover [data-icon],
    .bot-card:hover [data-icon] {
      color: var(--brand);
      animation: icon-hover-colour .34s ease both, icon-pop .34s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      filter: drop-shadow(0 0 6px rgba(214, 255, 117, .45))
    }

    .btn.primary:hover [data-icon],
    .btn.primary:focus-visible [data-icon] {
      color: var(--brand-ink);
      filter: none
    }

    /* Logos, Marks & Icons Hover Animations */
    .clipnary-mark,
    .top-brand .clipnary-mark,
    .side-head .logo,
    .social-link,
    .applogo {
      transition: transform .26s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .26s ease, filter .26s ease;
      cursor: pointer
    }

    .clipnary-mark:hover,
    .top-brand .clipnary-mark:hover {
      transform: scale(1.12) rotate(4deg);
      box-shadow: 0 0 16px rgba(214, 255, 117, .35)
    }

    .social-link:hover {
      transform: translateY(-2px) scale(1.08);
      color: var(--brand);
      filter: drop-shadow(0 0 10px rgba(214, 255, 117, .4))
    }

    .social-link:hover svg {
      transform: scale(1.18) rotate(5deg);
      color: var(--brand)
    }

    .applogo:hover {
      transform: scale(1.08) rotate(-2deg);
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .45))
    }

    .provider-icon {
      transition: transform .24s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .24s ease
    }

    .provider-option:hover .provider-icon,
    .provider-trigger:hover .provider-icon,
    .provider-icon:hover {
      transform: scale(1.14) rotate(-3deg);
      box-shadow: 0 0 12px currentColor
    }

    .provider-option:hover .provider-icon svg,
    .provider-icon:hover svg {
      transform: scale(1.12)
    }

    /* Images, Avatars, Video Thumbs Hover Zoom */
    .recent-thumb img,
    .recipe-source-media img,
    .applogo img,
    .chprev img,
    .avatar img,
    .tav {
      transition: transform .3s cubic-bezier(0.2, 0, 0, 1), filter .3s ease
    }

    .recent-thumb:hover img,
    .chprev:hover img,
    .appcard:hover .applogo img {
      transform: scale(1.08);
      filter: brightness(1.05)
    }

    /* Scroll-triggered reveal animations */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .45s ease-out, transform .45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform
    }

    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0)
    }

    /* Sharp edges enforcement on all containers */
    .card,
    .side-card,
    .panel,
    .box,
    .howto-step,
    .howto-video-card,
    .appcard,
    .appsetup,
    .tutorial-list>div,
    .bot-card,
    .recent-video,
    .rights-card,
    .effect-panel,
    .transition-card,
    .composer,
    .editor,
    .dlg,
    dialog,
    .tile,
    .set-sec,
    .vb,
    .note,
    .menu,
    .dropdown,
    .modal,
    .recent-skeleton {
      border-radius: 0 !important
    }

    /* Bot Guides Grid */
    .bot-guides-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
      margin-top: 16px
    }

    .bot-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--muted);
      border: 1px solid var(--line);
      border-radius: 0 !important;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease
    }

    .bot-card:hover {
      border-color: var(--brand);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3)
    }

    .bot-card-head {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .bot-card-head .provider-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 0 !important;
      flex: none
    }

    .bot-card-head b {
      font-size: 14px;
      color: var(--text);
      display: block
    }

    .bot-card-head span {
      font-size: 11px;
      color: var(--dim);
      display: block
    }

    .bot-card-body {
      font-size: 12px;
      color: var(--dim);
      line-height: 1.45;
      flex: 1
    }

    .bot-card-body code {
      background: #0B0E17;
      padding: 2px 6px;
      color: var(--brand);
      font-size: 11px;
      border-radius: 0 !important
    }

    .bot-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line)
    }

    .bot-card-foot .btn {
      font-size: 11px;
      height: 28px;
      padding: 0 9px
    }

    .bot-card-foot a {
      font-size: 11px;
      color: var(--dim);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .bot-card-foot a:hover {
      color: var(--brand);
      text-decoration: underline
    }

    /* How to Use Video Tutorial & In-Depth Guide */
    .howto-video-card {
      display: grid;
      gap: 14px;
      padding: 22px;
      background: var(--muted);
      border: 1px solid var(--line);
      border-radius: 0 !important;
      margin-bottom: 20px
    }

    .howto-video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    .howto-video-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text)
    }

    .howto-video-embed {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      max-height: 420px;
      background: #0B0E17;
      border: 1px dashed var(--line-2);
      border-radius: 0 !important;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      padding: 28px;
      cursor: pointer
    }

    .video-placeholder .play-pulse {
      width: 56px;
      height: 56px;
      border-radius: 0 !important;
      background: var(--brand);
      color: var(--brand-ink);
      display: grid;
      place-items: center;
      animation: pulse-subtle 2s infinite ease-in-out;
      transition: transform .2s ease, background-color .2s ease
    }

    .video-placeholder:hover .play-pulse {
      transform: scale(1.15);
      background: var(--brand-press)
    }

    .video-placeholder .play-pulse svg {
      width: 26px;
      height: 26px;
      margin-left: 3px
    }

    .video-placeholder b {
      font-size: 15px;
      color: var(--text)
    }

    .video-placeholder span {
      font-size: 12px;
      color: var(--dim);
      max-width: 440px
    }

    .howto-details-sec {
      margin-top: 24px;
      display: grid;
      gap: 16px
    }

    .howto-detail-block {
      padding: 18px 20px;
      background: var(--surface, #151B2B);
      border: 1px solid var(--line);
      border-radius: 0 !important
    }

    .howto-detail-block h4 {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      color: var(--brand);
      margin-bottom: 8px
    }

    .howto-detail-block p {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.5;
      margin-bottom: 8px
    }

    .howto-detail-block ul {
      margin: 0;
      padding-left: 18px;
      font-size: 12px;
      color: var(--dim);
      line-height: 1.6
    }

    /* ---------- fields */
    :where(input:not([type=checkbox], [type=radio], [type=file], [type=range]), select, textarea) {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      min-width: 0;
      outline: none;
      transition: border-color .15s ease
    }

    :where(textarea) {
      height: auto;
      padding: 10px 12px;
      resize: vertical
    }

    :where(input:not([type=checkbox], [type=radio], [type=file], [type=range]), select, textarea):hover {
      border-color: #D9CCC2
    }

    :where(input:not([type=checkbox], [type=radio], [type=file], [type=range]), select, textarea):focus {
      background: #fff;
      border-color: var(--brand)
    }

    input:not([type=checkbox], [type=radio], [type=range]):focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: none
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--faint)
    }

    label.f {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12px;
      color: var(--dim);
      font-weight: 600
    }

    label.sw {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: var(--text);
      font-weight: 600
    }

    label.sw input {
      appearance: none;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: #DCD2D0;
      position: relative;
      cursor: pointer;
      flex: none;
      margin: 0
    }

    label.sw input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s
    }

    label.sw input:checked {
      background: var(--brand)
    }

    label.sw input:checked::after {
      transform: translateX(16px)
    }

    label.sw small {
      display: block;
      color: var(--dim);
      font-size: 12px;
      font-weight: 400
    }

    label.ck {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 13px;
      border-radius: var(--r);
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line-2);
      font-weight: 500
    }

    label.ck:has(input:checked) {
      background: var(--brand-soft);
      border-color: var(--brand-line);
      color: var(--brand-ink)
    }

    label.ck input {
      accent-color: var(--brand);
      margin: 0
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px
    }

    .span {
      grid-column: 1/-1
    }

    /* ---------- surfaces */
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 22px;
      margin-bottom: 16px
    }

    .card>h2,
    .card-head h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--brand-ink)
    }

    .card>h2 {
      margin-bottom: 4px
    }

    .card>h2+.help {
      margin-bottom: 18px
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .help,
    .sub {
      color: var(--dim);
      font-size: 13px
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .tabbtn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 46px;
      padding: 0 14px;
      border: 0;
      background: transparent;
      color: var(--faint);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      border-radius: 10px 10px 0 0;
      white-space: nowrap
    }

    .tabbtn svg {
      width: 17px;
      height: 17px
    }

    .tabbtn .n {
      font-size: 11px;
      font-weight: 600;
      min-width: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--muted);
      color: var(--dim);
      text-align: center;
      transition: background-color .15s ease, color .15s ease
    }

    .tabbtn::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -1px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--brand);
      opacity: 0
    }

    .tabbtn.on {
      color: var(--brand-ink)
    }

    .tabbtn.on::after {
      opacity: 1;
      animation: tabin .28s ease
    }

    .tabbtn.on .n {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .tabbtn.on svg {
      color: var(--brand)
    }

    @keyframes tabin {
      from {
        transform: scaleX(.3);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--muted);
      color: var(--dim);
      white-space: nowrap;
      text-decoration: none
    }

    .pill.ok {
      color: var(--good);
      background: var(--good-soft)
    }

    .pill.bad {
      color: var(--bad);
      background: var(--bad-soft)
    }

    .pill.warn {
      color: var(--brand-deep);
      background: var(--brand-soft)
    }

    .pill.live {
      color: #fff;
      background: var(--live)
    }

    .pill.brand {
      color: var(--brand-ink);
      background: var(--brand)
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.3s infinite
    }

    @keyframes pulse {
      50% {
        opacity: .3
      }
    }

    @keyframes skeleton {
      to {
        background-position: -120% 0
      }
    }

    .empty {
      border: 1px dashed var(--line-2);
      border-radius: var(--r);
      padding: 48px 20px;
      text-align: center;
      color: var(--dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    .empty img {
      width: 56px;
      height: 56px;
      margin-bottom: 12px
    }

    .empty b {
      display: block;
      color: var(--brand-ink);
      font-size: 15px;
      font-weight: 600
    }

    /* ---------- home hero + composer */
    .hero {
      position: relative;
      padding: 44px 28px 52px;
      text-align: center
    }

    .home-page-bg {
      display: none
    }

    .app.home-video-page #main {
      position: relative;
      isolation: isolate;
      background: transparent
    }

    .app.home-video-page .home-page-bg {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: var(--frame) url('/brand/clipnary-hero-poster.jpg') center / cover no-repeat
    }

    .home-page-bg video,
    .home-page-bg .home-page-scrim {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0
    }

    .home-page-bg video {
      display: block;
      object-fit: cover;
      object-position: center;
      user-select: none
    }

    .home-page-bg .home-page-scrim {
      z-index: 1;
      background: rgba(7, 13, 27, .68)
    }

    .app.home-video-page #vbanner,
    .app.home-video-page #heroSlot,
    .app.home-video-page #view {
      position: relative;
      z-index: 1
    }

    #view {
      position: relative;
      z-index: 1
    }

    .hero h2 {
      font-size: clamp(21px, 5.2vw, 28px);
      font-weight: 700;
      letter-spacing: -.03em;
      color: var(--brand-ink);
      line-height: 1.2;
      text-wrap: balance
    }

    .hero>p {
      color: var(--dim);
      margin: 8px auto 22px;
      max-width: 520px;
      font-size: 15px
    }

    .composer {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: var(--r-lg);
      text-align: left;
      transition: background-color .15s ease, border-color .15s ease
    }

    .composer:has(#url:focus) {
      border-color: var(--brand, #c8ff3b)
    }

    .composer.compact {
      max-width: none;
      margin-bottom: 28px;
      background: var(--muted)
    }

    .composer.over {
      background: var(--brand-soft);
      border-color: var(--brand)
    }

    .composer :focus-visible {
      outline: none
    }

    .composer-input {
      position: relative;
      display: flex;
      align-items: center
    }

    .composer-input>svg {
      position: absolute;
      left: 18px;
      color: var(--faint);
      width: 20px;
      height: 20px;
      transition: color .15s ease
    }

    .composer-input:focus-within>svg {
      color: var(--brand)
    }

    .composer-input input,
    .composer-input input:focus {
      height: 60px;
      border: 0;
      background: transparent;
      padding: 0 18px 0 48px;
      font-size: 16px;
      border-radius: var(--r-lg) var(--r-lg) 0 0
    }

    .composer-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 2px 10px 10px 12px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 0;
      background: var(--muted);
      color: var(--dim);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .15s ease, color .15s ease
    }

    .composer.compact .chip {
      background: #fff
    }

    .chip svg {
      width: 16px;
      height: 16px
    }

    .chip:hover,
    .chip:focus-visible {
      background: #EDE3DB;
      color: var(--text)
    }

    .chip.on,
    .pick.open .chip {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .hint {
      font-size: 12px;
      color: var(--faint);
      margin-right: 6px
    }

    .composer-bar {
      flex-wrap: nowrap
    }

    .composer-bar .grow {
      display: none
    }

    .composer-bar .hint {
      flex: 1 1 0;
      min-width: 0;
      text-align: right;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    @media (max-width:560px) {
      .composer-bar {
        flex-wrap: wrap
      }
    }

    .composer.has-link .composer-bar .chip,
    .composer.has-link .composer-bar .pick,
    .composer.has-link .composer-bar .hint {
      display: none
    }

    .composer.has-link .composer-bar {
      justify-content: flex-end
    }

    .composer-opts {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .32s ease, opacity .25s ease
    }

    .composer-opts.open {
      grid-template-rows: 1fr;
      opacity: 1
    }

    .composer-opts>.og {
      min-height: 0;
      overflow: hidden;
      padding: 0 12px;
      transition: padding .32s ease
    }

    .composer-opts.open>.og {
      padding-bottom: 12px
    }

    /* attachments: link preview and files */
    .att {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s ease
    }

    .att.has {
      grid-template-rows: 1fr
    }

    .att>div {
      min-height: 0;
      overflow: hidden
    }

    .att-in {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px 8px
    }

    .lp {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 12px;
      background: var(--muted);
      animation: rise .28s ease both
    }

    .composer.compact .lp {
      background: #fff
    }

    .lp .th {
      position: relative;
      flex: none;
      width: 112px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #2A1A12
    }

    .lp .th img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .lp .th .du {
      position: absolute;
      right: 5px;
      bottom: 5px;
      background: rgba(20, 12, 8, .82);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 6px
    }

    .lp .tx {
      min-width: 0;
      flex: 1
    }

    .lp .tx b {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .lp .tx span {
      display: block;
      font-size: 12px;
      color: var(--faint);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .lp .ok {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #1F7A4D;
      background: #E3F4EA;
      padding: 4px 10px;
      border-radius: 999px
    }

    .lp .ok svg {
      width: 14px;
      height: 14px
    }

    .lp .ok.live {
      background: #E5323F;
      color: #fff
    }

    .lp .ok.live i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.3s infinite
    }

    .lp.bad {
      background: #FDECEC;
      color: #A12A2A;
      font-size: 13px;
      padding: 10px 12px
    }

    .lp.bad>span {
      flex: 1;
      min-width: 0
    }

    .lp.bad b {
      display: block;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #7A1F1F
    }

    .lp.wait .rm {
      margin-left: auto
    }

    .lp.bad svg {
      width: 16px;
      height: 16px;
      flex: none
    }

    .lp.wait .th,
    .sk {

    .lp.pending {

    .lp.pending .th {

      place-items: center;
      background: var(--brand-soft);
      color: var(--brand-deep)

    .lp.pending .th svg {

      height: 24px
    }

    .lp.pending .ok {
      background: var(--brand-soft);
      color: var(--brand-deep)
    }

    .lp {

      overflow: hidden
    }

    .lp .th video {

      height: 100%;

      display: block
    }

    .lp .tx em {

    .lp .ok.up {

    }

    .lp .rm {

      height: 30px;

      place-items: center;

      background: #FDECEC;
      color: #C53030
    }

    .lp .rm svg {
      width: 14px;
      height: 14px
    }

    .lp .pbar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: var(--brand);

    }

    .addrow {

      align-items: center;
      gap: 8px;
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease;

    }

    .addrow:hover,
    .addrow:focus-visible {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .addrow svg {
      width: 16px;
      height: 16px
    }

    .addrow span {
      margin-left: auto;
      font-weight: 500;
      color: var(--faint);
      font-size: 12px
    }

    @media (max-width:560px) {
      .lp .th {
        width: 88px
      }

      .lp .ok {
        display: none
      }
    }

    .btn.primary:disabled {
      background: #F3E7DD;
      color: #B9A597;
      cursor: not-allowed
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0
      }

      to {
        background-position: -200% 0
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .process-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(255, 252, 249, .94);
      backdrop-filter: blur(7px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease
    }

    .process-overlay.on {
      opacity: 1;
      pointer-events: auto
    }

    .process-card {
      width: min(540px, 100%);
      padding: 34px 32px 28px;
      border: 1px solid var(--line-2);
      border-radius: 24px;
      background: #fff;
      text-align: center;
      animation: rise .35s ease both
    }

    .process-orb {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--brand-soft);
      color: var(--brand-deep)
    }

    .process-orb:before,
    .process-orb:after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid var(--brand);
      border-radius: 50%;
      opacity: .28;
      animation: process-ring 2s ease-out infinite
    }

    .process-orb:after {
      animation-delay: 1s
    }

    .process-orb svg {
      width: 34px;
      height: 34px;
      position: relative;
      z-index: 1
    }

    .process-card h2 {
      font-size: 22px;
      color: var(--brand-ink);
      margin: 0 0 7px
    }

    .process-card p {
      font-size: 13px;
      color: var(--dim);
      margin: 0 auto;
      max-width: 410px;
      min-height: 20px
    }

    .process-steps {
      display: grid;
      gap: 9px;
      margin: 24px 0 18px;
      text-align: left
    }

    .process-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 11px;
      background: var(--muted);
      color: var(--faint);
      font-size: 13px;
      transition: background-color .2s ease, color .2s ease, transform .2s ease
    }

    .process-step i {
      width: 23px;
      height: 23px;
      flex: none;
      border: 1px solid var(--line-2);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 11px;
      font-weight: 700
    }

    .process-step.active {
      background: var(--brand-soft);
      color: var(--brand-ink);
      transform: translateX(3px)
    }

    .process-step.active i {
      border-color: var(--brand);
      background: var(--brand);
      color: var(--brand-ink);
      animation: pulse 1.2s infinite
    }

    .process-step.done {
      color: var(--good);
      background: var(--good-soft)
    }

    .process-step.done i {
      border-color: var(--good);
      background: var(--good);
      color: #fff
    }

    .process-meter {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #F0E8E3
    }

    .process-meter i {
      display: block;
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
      transition: width .35s ease;
      position: relative;
      overflow: hidden
    }

    .process-meter i:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent);
      animation: process-shine 1.2s linear infinite
    }

    .process-foot {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      color: var(--faint);
      font-size: 11px
    }

    .process-foot b {
      color: var(--brand-deep);
      font-weight: 600
    }

    @keyframes process-ring {
      0% {
        transform: scale(.8);
        opacity: .38
      }

      70%,
      100% {
        transform: scale(1.25);
        opacity: 0
      }
    }

    @keyframes process-shine {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(100%)
      }
    }

    .working {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--brand);
      background: rgba(200, 255, 59, .14);
      padding: 2px 8px 2px 6px;
      border-radius: 999px
    }

    .working i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid currentColor;
      border-right-color: transparent;
      animation: spin .8s linear infinite
    }

    .nav-item.on .working {
      background: rgba(42, 26, 18, .14);
      color: var(--brand-ink)
    }

    .app.mini .nav-item .working {
      display: none
    }

    /* custom dropdown: a dark panel, no border or shadow needed against the white */
    .pick {
      position: relative
    }

    .pick .car {
      width: 13px;
      height: 13px;
      transition: transform .15s ease
    }

    .pick.open .car {
      transform: rotate(180deg)
    }

    .pick-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 30;
      min-width: 230px;
      max-height: 280px;
      overflow: auto;
      background: #151b26;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s
    }

    .pick.open .pick-menu {
      opacity: 1;

      transform: none;
      pointer-events: auto
    }

    .pick-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: #E9DED6;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease
    }

    .pick-opt:hover,
    .pick-opt:focus-visible {
      background: rgba(255, 255, 255, .08);
      color: #fff
    }

    .pick-new {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, .08);
      border-radius: 0 0 8px 8px;
      background: transparent;
      color: var(--brand, #c8ff3b);
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease
    }

    .pick-new:hover,
    .pick-new:focus-visible {
      background: rgba(200, 255, 59, .14);
      color: #d6ff75
    }

    .pick-new .av {
      background: rgba(200, 255, 59, .18)
    }

    .pick-empty {
      margin: 6px 10px 4px;
      font-size: 12px;
      line-height: 1.45;
      color: #B9A597
    }

    img.av {
      object-fit: cover
    }

    .pick-opt .av,
    .pick-new .av {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      background: rgba(200, 255, 59, .18);
      color: var(--brand, #c8ff3b)
    }

    .pick-new .av svg,
    .pick-opt .av svg {
      width: 14px;
      height: 14px
    }

    .pick-opt .tick {
      margin-left: auto;
      width: 15px;
      height: 15px;
      color: var(--brand);
      visibility: hidden
    }

    .pick-opt[aria-selected=true] .tick {
      visibility: visible
    }

    .pick-opt[aria-selected=true] {
      color: #fff
    }

    /* options panel */
    .og {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px
    }

    .ob {
      background: var(--muted);

      padding: 12px 14px 14px;
      min-width: 0

    }

    }

      font-size: 12px;

    .nstep .ctl {

    }

      flex: none;
      width: 28px;

      border-radius: 8px;
      border: 0;

      place-items: center;

      transition: background-color .15s ease, color .15s ease
    }

    .composer.compact .nstep .ctl button {
      background: #fff
    }

    .nstep .ctl button:hover,
    .nstep .ctl button:focus-visible {
      background: var(--brand);
      color: #fff
    }

    .nstep .ctl button svg {
      width: 14px;
      height: 14px
    }

    .nstep input,
    .nstep input:focus {
      flex: 1;
      min-width: 0;
      height: 30px;
      padding: 0;
      border: 0;

    }

      border-radius: 10px;

      color: var(--dim);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color .15s ease, color .15s ease
    }

    }

    .tile-o:hover,
    .tile-o:focus-visible {
      background: #EDE3DB;
      color: var(--text)
    }

    .tile-o[aria-pressed=true] {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .cap-prev {
      height: 54px;
      border-radius: 7px;
      background: #1E1612;

      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      font-size: 14px;
      line-height: 1;
      color: #fff;
      letter-spacing: 0;
      -webkit-text-stroke: 1px #000;
      paint-order: stroke fill
    }

    .cap-prev b {
      font-weight: inherit
    }

    .lay-prev {
      height: 54px;
      border-radius: 7px;
      background: #1E1612;
      display: grid;
      place-items: center
    }

    .lay-prev .ph {
      position: relative;
      width: 28px;
      height: 48px;
      border-radius: 4px;
      overflow: hidden;
      background: #4A3428
    }

    .lay-prev .ph::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #B4643A, #5E3A2A);
      filter: blur(3px);
      opacity: .75
    }

    .lay-prev .ph i {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 16px;
      background: linear-gradient(135deg, var(--brand, #c8ff3b), #8fdd24)
    }

    .lay-prev.zoom .ph i {
      left: -6px;
      right: -6px;
      height: 24px
    }

    .lay-prev.crop .ph i {
      left: 0;
      right: 0;
      top: 0;
      height: 100%;
      transform: none
    }

    .seg {

      border-radius: 10px;
      padding: 4px
    }

    .composer.compact .seg {
      background: var(--muted)
    }

      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 7px 6px;
      border: 0;
      border-radius: 7px;
      background: transparent;

      font-size: 13px;
      font-weight: 600;
      cursor: pointer;

    }

      color: var(--faint);

    }

    .seg button:hover,
    .seg button:focus-visible {
      background: #EDE3DB;
      color: var(--text)
    }

    .seg button[aria-pressed=true] {

      color: var(--brand-ink)
    }

      grid-template-columns: repeat(4, minmax(0, 1fr));

    }

      color: var(--text)
    }

    .set-link small {
      display: block;
      font-size: 12px;
      color: var(--faint);
      line-height: 1.4
    }

    .set-link:hover {
      background: var(--muted)
    }

    .set-link.on {
      background: var(--brand-soft)
    }

    .set-link.on svg {
      color: var(--brand-deep)
    }

    .set-link.on b {
      color: var(--brand-ink)
    }

    .set-body {
      min-width: 0;
      animation: rise .25s ease both
    }

    .ai-form {
      display: grid;
      gap: 18px;
      max-width: 560px
    }

    .ai-form select {
      width: 100%
    }

    .ai-form .with {
      display: flex;
      gap: 8px
    }

    .ai-form .with input {
      flex: 1;
      min-width: 0
    }

    .ai-form .hint {
      font-size: 12px;
      font-weight: 400;
      color: var(--dim)
    }

    .ai-form .hint a {
      color: var(--brand-deep);
      font-weight: 600
    }

    .ai-form .hint a:hover {
      color: var(--brand-ink)
    }

    .provider-picker {
      position: relative
    }

    .provider-field {
      display: grid;
      gap: 7px;
      font-size: 12px;
      color: var(--dim);
      font-weight: 600
    }

    .provider-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      background: var(--muted);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease
    }

    .provider-trigger:hover,
    .provider-trigger[aria-expanded=true] {
      background: #202B40;
      border-color: var(--brand);
      color: var(--text)
    }

    .provider-trigger>.provider-selected {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 600
    }

    .provider-trigger .provider-caret {
      width: 15px;
      height: 15px;
      color: var(--dim);
      transition: transform .18s ease
    }

    .provider-trigger[aria-expanded=true] .provider-caret {
      transform: rotate(180deg);
      color: var(--brand)
    }

    .provider-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      z-index: 50;
      display: grid;
      gap: 3px;
      padding: 6px;
      background: #1B2437;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      max-height: 310px;
      overflow: auto
    }

    .provider-menu[hidden] {
      display: none
    }

    .provider-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease
    }

    .provider-option:hover,
    .provider-option:focus-visible,
    .provider-option[aria-selected=true] {
      background: var(--brand-soft);
      color: var(--text)
    }

    .provider-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 0 !important;
      background: #131A29;
      border: 1px solid rgba(255, 255, 255, .08);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -.02em;
      flex: none;
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease
    }

    .provider-icon svg {
      width: 20px;
      height: 20px;
      display: block;
      transition: transform .2s ease, filter .2s ease
    }

    .provider-option:hover .provider-icon,
    .provider-option:focus-visible .provider-icon,
    .provider-option[aria-selected=true] .provider-icon {
      background: #1B253B;
      border-color: rgba(255, 255, 255, .24);
      transform: scale(1.08)
    }

    .provider-option:hover .provider-icon svg,
    .provider-option:focus-visible .provider-icon svg,
    .provider-option[aria-selected=true] .provider-icon svg {
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .4)) brightness(1.15)
    }

    .provider-copy {
      display: grid;
      gap: 1px;
      min-width: 0
    }

    .provider-copy b {
      font-size: 13px;
      font-weight: 600
    }

    .provider-copy small {
      color: var(--dim);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .provider-check {
      margin-left: auto;
      color: var(--brand);
      visibility: hidden
    }

    .provider-option[aria-selected=true] .provider-check {
      visibility: visible
    }

    .provider-native {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none
    }

    .ai-state {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .set-sec {
      padding: 0 0 26px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--line)
    }

    .set-sec:last-child {
      border-bottom: 0
    }

    .set-sec h2 {
      font-size: 17px;
      color: var(--brand-ink);
      margin-bottom: 4px
    }

    .set-sec .help {
      margin-bottom: 16px
    }

    .set-load {
      padding: 40px 0;
      color: var(--faint)
    }

    .fields.narrow {
      max-width: 420px;
      grid-template-columns: 1fr
    }

    .prof {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px
    }

    .prof-pic {
      width: 56px;
      height: 56px;
      font-size: 22px;
      border-radius: 50%;
      object-fit: cover;
      color: #fff
    }

    .prof b {
      display: block;
      font-size: 16px;
      color: var(--brand-ink)
    }

    .prof span {
      font-size: 13px;
      color: var(--dim)
    }

    .kv {
      margin: 0 0 12px;
      border-top: 1px solid var(--line)
    }

    .kv div {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .kv dt {
      font-size: 13px;
      color: var(--dim)
    }

    .kv dd {
      margin: 0;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .appcard {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px
    }

    .applogo {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: transparent !important;
      border: none !important
    }

    .applogo svg,
    .applogo img {
      width: 42px;
      height: 42px;
      display: block;
      object-fit: contain;
      transition: transform .24s cubic-bezier(0.34, 1.56, 0.64, 1), filter .24s ease
    }

    .appcard:hover .applogo img,
    .appcard:focus-within .applogo img,
    .appcard:hover .applogo svg {
      transform: scale(1.1) rotate(-2deg);
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .4)) brightness(1.1)
    }

    .apptx {
      flex: 1;
      min-width: 0
    }

    .apptx>b {
      display: block;
      font-size: 15px;
      color: var(--brand-ink)
    }

    .apptx>span {
      font-size: 13px;
      color: var(--dim)
    }

    .appact {
      flex: none
    }

    .appcard {
      flex-wrap: wrap
    }

    .stor-path {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .stor-path code {
      flex: 1 1 260px;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
      background: var(--muted);
      border-radius: 8px;
      padding: 10px 12px
    }

    .stor-bar {
      height: 10px;
      border-radius: 999px;
      background: var(--muted);
      overflow: hidden;
      margin: 14px 0 6px
    }

    .stor-bar i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 999px
    }

    .stor-bar.low i {
      background: var(--bad)
    }

    .stor-nums {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--dim)
    }

    .stor-change {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--muted);
      display: grid;
      gap: 12px
    }

    .stor-change .with {
      display: flex;
      gap: 8px
    }

    .stor-change .with input {
      flex: 1;
      min-width: 0
    }

    .appsetup {
      flex-basis: 100%;
      margin-top: 4px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--muted);
      display: grid;
      gap: 12px
    }

    .appsetup ol {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text);
      display: grid;
      gap: 4px
    }

    .appsetup a {
      color: var(--brand-deep);
      font-weight: 600
    }

    .appsetup a:hover {
      color: var(--brand-ink)
    }

    .appsetup .copyrow {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .appsetup .copyrow code {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 12px;
      background: #fff;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 8px 10px
    }

    .appsetup .warnline {
      font-size: 12px;
      color: var(--brand-deep)
    }

    .appact {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .applist {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px
    }

    .applist div {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .applist .btn {
      margin-left: auto
    }

    @media (max-width:860px) {
      .set-layout {
        grid-template-columns: 1fr;
        gap: 16px
      }

      .set-nav {
        position: static;
        flex-direction: row;
        overflow-x: auto
      }

      .set-link small {
        display: none
      }

      .set-link {
        flex: none
      }

      .kv div {
        grid-template-columns: 1fr;
        gap: 2px
      }
    }

    .savebar {
      position: sticky;
      bottom: 16px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 10px 16px;
      margin-top: 8px;
      border-radius: 14px;
      background: var(--brand-ink);
      color: #F4ECE6;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease
    }

    .savebar.on {
      opacity: 1;
      transform: none;
      pointer-events: auto
    }

    .savebar>span {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500
    }

    .savebar>span svg {
      width: 16px;
      height: 16px;
      color: var(--brand)
    }

    .savebar .btn.ghost {
      color: #E9DED6;
      background: transparent;
      border-color: transparent
    }

    .savebar .btn.ghost:hover {
      background: rgba(255, 255, 255, .08)
    }

    .step .n {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
      flex: none;
      color: var(--brand-ink)
    }

    .step b {
      display: block;
      font-weight: 600;
      color: var(--text)
    }

    .step .d {
      font-size: 12px;
      color: var(--dim)
    }

    .step>svg {
      color: var(--faint);
      margin-left: auto
    }

    .allset {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: var(--r);
      background: var(--good-soft);
      color: var(--good);
      font-weight: 600
    }

    /* ---------- jobs + clips */
    .job {
      margin-bottom: 36px
    }

    .job-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px
    }

    .jt {
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0
    }

    .jthumb {
      position: relative;
      flex: none;
      width: 128px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--muted);
      display: grid;
      place-items: center;
      color: var(--faint)
    }

    .jthumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .jthumb>svg {
      width: 22px;
      height: 22px
    }

    .jthumb .du {
      position: absolute;
      right: 5px;
      bottom: 5px;
      background: rgba(20, 12, 8, .82);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 6px
    }

    @media (max-width:560px) {
      .jthumb {
        width: 92px
      }
    }

    .job-head h3 {
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere;
      color: var(--brand-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .bar {
      height: 6px;
      background: var(--muted);
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 999px;
      transition: width .8s ease
    }

    .more-box {
      margin: 10px 0 14px;
      padding: 12px 14px;
      border: 1px solid var(--brand-line);
      border-radius: var(--r);
      background: var(--brand-soft)
    }

    .more-box .bar {
      background: #fff;
      margin: 8px 0 3px
    }

    .more-box .bar i {
      background: var(--brand-deep)
    }

    .more-box .row {
      align-items: center
    }

    .more-box b {
      font-size: 13px;
      color: var(--brand-ink)
    }

    .err {
      color: var(--bad);
      font-size: 13px;
      overflow-wrap: anywhere;
      margin: 6px 0
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px
    }

    .clip {
      background: var(--frame-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .shot {
      position: relative;
      aspect-ratio: 9/16;
      background: #17110E;
      border: 0;
      padding: 0;
      cursor: pointer;
      display: block;
      width: 100%;
      overflow: hidden
    }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .shot .veil {
      position: absolute;
      left: 10px;
      bottom: 10px
    }

    .veil span {
      width: 34px;
      height: 34px;
      border-radius: 0;
      background: var(--brand, #c8ff3b);
      display: grid;
      place-items: center;
      color: var(--brand-ink, #0d131f)
    }

    .veil svg {
      width: 15px;
      height: 15px;
      margin-left: 2px
    }

    .badge {
      position: absolute;
      top: 10px;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 0;
      background: #18202d;
      color: var(--text)
    }

    .badge.l {
      left: 10px
    }

    .badge.r {
      right: 10px
    }

    .badge.s-hi {
      background: var(--brand, #c8ff3b);
      color: var(--brand-ink, #0d131f)
    }

    .badge.s-mid {
      background: rgba(200, 255, 59, .22);
      border: 1px solid rgba(200, 255, 59, .4);
      color: var(--text)
    }

    .making {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 14px;
      color: var(--dim);
      font-size: 13px;
      font-weight: 500;
      background: linear-gradient(110deg, #121a2b 30%, #1b263c 50%, #121a2b 70%);
      background-size: 220% 100%;
      animation: shim 1.6s linear infinite
    }

    @keyframes shim {
      to {
        background-position: -220% 0
      }
    }

    .clip-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1
    }

    .hook {
      font-weight: 600;
      font-size: 13px;
      color: var(--brand)
    }

    .ttl {
      color: var(--dim);
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .selck {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      flex: none;
      transition: background-color .15s ease
    }

    .selck:hover {
      background: var(--brand-soft)
    }

    .selck input {
      width: 16px;
      height: 16px;
      accent-color: var(--brand);
      cursor: pointer;
      margin: 0
    }

    .clip.picked {
      border-color: var(--brand)
    }

    #selbar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 60;
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 24px);
      padding: 10px 12px 10px 18px;
      border-radius: 0;
      background: #151b24;
      color: #f0f6fc;
      font-size: 14px;
      border: 1px solid rgba(200, 255, 59, .3)
    }

    #selbar.on {
      display: flex
    }

    #selbar b {
      font-weight: 700;
      margin-right: 6px
    }

    #selbar .btn {
      background: transparent;
      color: #f0f6fc;
      border-color: rgba(255, 255, 255, .2)
    }

    #selbar .btn:hover {
      background: rgba(255, 255, 255, .1)
    }

    #selbar .btn.primary {
      background: var(--brand);
      color: #0d131f;
      border-color: var(--brand)
    }

    #selbar .btn.primary:hover {
      background: #d6ff75
    }

    #selbar .btn.danger {
      color: #FF9A8F;
      border-color: rgba(255, 154, 143, .45)
    }

    #selbar .btn.danger:hover {
      background: rgba(255, 154, 143, .14)
    }

    .danger-card {
      border-color: #F3C9C4
    }

    .danger-card h2 {
      color: var(--bad)
    }

    .clip-foot {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--line)
    }

    .livecard {
      background: #fff;
      border: 1px solid #F4C9CD;
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 28px
    }

    .lc-head {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between
    }

    .lc-title {
      flex: 1;
      min-width: 0
    }

    .lc-title h3 {
      margin-top: 8px;
      font-size: 16px;
      line-height: 1.4;
      color: var(--brand-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere
    }

    .lc-acts {
      flex: none;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .lc-acts .btn {
      height: 40px
    }

    @media (max-width:900px) {
      .lc-head {
        flex-direction: column
      }

      .lc-acts {
        width: 100%
      }

      .lc-acts .btn {
        flex: 1;
        justify-content: center
      }
    }

    .stats {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      margin: 18px 0

    .stat b {
